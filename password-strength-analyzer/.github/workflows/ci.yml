name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tk (needed to import tkinter headlessly)
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Check syntax
        run: python -m py_compile password_strength_analyzer.py

      - name: Run unit tests
        run: xvfb-run -a python -m unittest discover tests -v
